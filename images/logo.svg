<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#08090D" rx="24"/>

  <!-- Bold Z mark — represents Zenith, angular lines suggest a vertex/peak -->

  <!-- Top horizontal bar -->
  <line x1="54" y1="48" x2="146" y2="48"
        stroke="#CAFF33" stroke-width="13" stroke-linecap="round"/>

  <!-- Diagonal stroke (top-right to bottom-left) -->
  <line x1="146" y1="48" x2="54" y2="140"
        stroke="#CAFF33" stroke-width="13" stroke-linecap="round"/>

  <!-- Bottom horizontal bar -->
  <line x1="54" y1="140" x2="146" y2="140"
        stroke="#CAFF33" stroke-width="13" stroke-linecap="round"/>

  <!-- Accent dot — top-right corner, premium detail -->
  <circle cx="146" cy="48" r="5" fill="#ffffff" opacity="0.9"/>

  <!-- ZENITH wordmark -->
  <text x="100" y="167"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5"
        font-weight="700"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="2.5">ZENITH</text>

  <!-- VERTEX sub-label -->
  <text x="100" y="182"
        font-family="Arial, Helvetica, sans-serif"
        font-size="6.5"
        font-weight="400"
        fill="#CAFF33"
        text-anchor="middle"
        letter-spacing="3.5">VERTEX</text>
</svg>
